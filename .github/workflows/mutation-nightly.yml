name: Mutation (nightly, cold)

# agbossjs/agboss#1213, as the core's mutation-nightly.yml: every shard of
# scripts/mutation-shards.mjs with no cached results (`--force`), so a mutant an incremental run
# kept as killed is tested again against today's tests.
on:
  schedule:
    - cron: "47 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  # a three-member replica set (the stores' deployment; the failover tests step its primary down)
  # and a standalone mongod (the start check must refuse it); the tests fail without them, never skip
  AGBOSS_MONGODB_TEST_URL: mongodb://localhost:27017,localhost:27018,localhost:27019/?replicaSet=rs0
  AGBOSS_MONGODB_STANDALONE_TEST_URL: mongodb://localhost:27020/?directConnection=true

jobs:
  mutation:
    name: mutation ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard:
          [
            leases,
            fence,
            effects-and-calls,
            pauses,
            money,
            queue,
            queue-watch,
            ordering,
            a2a-direct,
            checkpoints,
            settings,
            cli,
            connection,
            migrations,
            outcome,
            store-bound,
          ]
    env:
      MUTATION_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4

      - name: Start MongoDB 7 (replica set rs0 on 27017-27019, standalone on 27020)
        run: .github/start-mongo.sh

      - name: Resolve the pinned framework
        id: pin
        run: |
          echo "sha=$(node -p "require('./.agboss-version.json').frameworkSha")" >> "$GITHUB_OUTPUT"
          echo "source=$(node -p "require('./.agboss-version.json').source ?? 'commit'")" >> "$GITHUB_OUTPUT"

      - name: Check out agbossjs/agboss at the pinned SHA
        if: steps.pin.outputs.source != 'registry'
        uses: actions/checkout@v4
        with:
          repository: agbossjs/agboss
          ref: ${{ steps.pin.outputs.sha }}
          path: .agboss-source

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Pack @agboss/core as pinned (a commit, or the registry's) and install the tarball
        env:
          AGBOSS_REPO_DIR: .agboss-source
        run: |
          npm run pack:framework
          npm run install:packed

      - name: Initiate the replica set
        run: .github/mongo-replica-set.sh

      # the CLI's tests run bin/, which imports the built package; the flow types for the fixtures
      - name: Build
        run: npm run build && npm run check:types

      - name: Mutation testing of the shard, every mutant (break below 100 % killed or justified)
        # below the job's 120 minutes, so a runaway shard fails here and its report still uploads
        timeout-minutes: 100
        run: npm run test:mutation -- --force

      # a Timeout counts as killed and hid survivors (agbossjs/mongodb#103): none that is not a proven hang; an unlisted one is run again alone (agbossjs/agboss#1367)
      - name: Timeouts of the shard are proven hangs
        if: always() && hashFiles(format('reports/mutation/{0}.json', matrix.shard)) != ''
        run: node scripts/stryker-timeouts.mjs --rerun --stryker scripts/mutation-run.mjs reports/mutation/${{ matrix.shard }}.json

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report-${{ matrix.shard }}
          path: reports/mutation/
