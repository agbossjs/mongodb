name: CI

on:
  push:
    branches: [main]
  pull_request:
  # agbossjs/agboss#484: the fault suite on the real clock, every night
  schedule:
    - cron: "37 3 * * *"

permissions:
  contents: read

env:
  # a three-member replica set (the stores' deployment; the failover tests step its primary down)
  # and a standalone mongod (the start check must refuse it); the tests fail without them, never skip
  AGBOSS_MONGODB_TEST_URL: mongodb://localhost:27017,localhost:27018,localhost:27019/?replicaSet=rs0
  AGBOSS_MONGODB_STANDALONE_TEST_URL: mongodb://localhost:27020/?directConnection=true

jobs:
  # Changelog fragments (agbossjs/agboss#981): a PR adds changes/<issue>-<slug>.md; only a release PR (branch
  # release/<version>) edits CHANGELOG.md, where scripts/changelog-assemble.mjs folds the fragments in.
  changelog-fragments:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node scripts/changelog-assemble.mjs --check
      - name: CHANGELOG.md is edited only by a release PR
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          case "$HEAD_REF" in release/*) echo "release PR: CHANGELOG.md may change"; exit 0 ;; esac
          if git diff --no-renames --name-only "$BASE_SHA...$HEAD_SHA" | grep -qx 'CHANGELOG.md'; then
            echo "::error file=CHANGELOG.md::Do not edit CHANGELOG.md in a PR: add a fragment changes/<issue>-<slug>.md instead (see changes/README.md). Only a release PR (branch release/<version>) edits it."
            exit 1
          fi

  check:
    name: check (MongoDB 7, a 3-member replica set, @agboss/core at the pinned SHA)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # a service container cannot take a command (--replSet): the servers start here, booting
      # while the install runs; "Initiate the replica set" waits for them. enableTestCommands: the
      # retry and failover tests force errors with the server's own fail points.
      - name: Start MongoDB 7 (replica set rs0 on 27017-27019, standalone on 27020)
        run: .github/start-mongo.sh

      # agbossjs/agboss#691: a commit pin packs the core from agbossjs/agboss; a release pin
      # (`source: "registry"`) downloads the published core, so no checkout is needed
      - name: Resolve the pinned framework
        id: pin
        run: |
          echo "sha=$(node -p "require('./.agboss-version.json').frameworkSha")" >> "$GITHUB_OUTPUT"
          echo "source=$(node -p "require('./.agboss-version.json').source ?? 'commit'")" >> "$GITHUB_OUTPUT"

      - name: Check out agbossjs/agboss at the pinned SHA
        if: steps.pin.outputs.source != 'registry'
        uses: actions/checkout@v4
        with:
          repository: agbossjs/agboss
          ref: ${{ steps.pin.outputs.sha }}
          path: .agboss-source

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Pack @agboss/core as pinned (a commit, or the registry's) and install the tarball
        env:
          AGBOSS_REPO_DIR: .agboss-source
        run: |
          npm run pack:framework
          npm run install:packed

      - name: Initiate the replica set
        run: .github/mongo-replica-set.sh

      - name: Check (format, suppressions, installs, lint, types, tests with coverage, API report)
        run: npm run check

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e "const t=require('./coverage/coverage-summary.json').total;console.log('| | % |\n|---|---|\n'+['lines','branches','functions','statements'].map(k=>'| '+k+' | '+t[k].pct+' |').join('\n'))" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: MongoDB logs
        if: failure()
        run: for port in 27017 27018 27019; do docker logs "mongo-$port" 2>&1 | tail -60; done

  # agbossjs/agboss#484 AC2, #527 AC2: the core's fault suite on MongoDB — real pods on one replica
  # set, killed, stopped, frozen and cut off it. Always on the real clock (agbossjs/agboss#607:
  # MongoDB decides a lease's expiry by its own $$NOW, so the pods run at its rate, the core's 30 s
  # lease), its scenarios split over three jobs to fit.
  faults:
    name: faults ${{ matrix.shard }}/3 (the fault suite on a MongoDB 7 replica set)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      AGBOSS_FAULT_SHARD: ${{ matrix.shard }}/3
      AGBOSS_FAULT_DUMP_DIR: ${{ github.workspace }}/fault-dumps
    steps:
      - uses: actions/checkout@v4

      - name: Start MongoDB 7 (replica set rs0 on 27017-27019, standalone on 27020)
        run: .github/start-mongo.sh

      # agbossjs/agboss#691: a commit pin packs the core from agbossjs/agboss; a release pin
      # (`source: "registry"`) downloads the published core, so no checkout is needed
      - name: Resolve the pinned framework
        id: pin
        run: |
          echo "sha=$(node -p "require('./.agboss-version.json').frameworkSha")" >> "$GITHUB_OUTPUT"
          echo "source=$(node -p "require('./.agboss-version.json').source ?? 'commit'")" >> "$GITHUB_OUTPUT"

      - name: Check out agbossjs/agboss at the pinned SHA
        if: steps.pin.outputs.source != 'registry'
        uses: actions/checkout@v4
        with:
          repository: agbossjs/agboss
          ref: ${{ steps.pin.outputs.sha }}
          path: .agboss-source

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Pack @agboss/core as pinned (a commit, or the registry's) and install the tarball
        env:
          AGBOSS_REPO_DIR: .agboss-source
        run: |
          npm run pack:framework
          npm run install:packed

      - name: Initiate the replica set
        run: .github/mongo-replica-set.sh

      - name: The fault suite
        run: npm run test:faults

      - name: The failed scenarios' events and store history
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fault-dumps-${{ matrix.shard }}
          path: fault-dumps
          if-no-files-found: ignore

  # agbossjs/agboss#1213 (the core's #533 item 3, #626): mutation testing of the money-path modules,
  # one job per shard of scripts/mutation-shards.mjs (MUTATION_SHARD), each incremental — its last
  # run's results cached, keyed by the mutation setup, so a change of the Stryker config or of a
  # shard's modules or tests runs it cold: every mutant killed or justified where it stands, else
  # red. mutation-nightly.yml runs every shard cold.
  mutation:
    name: mutation ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard:
          [
            leases,
            fence,
            effects-and-calls,
            pauses,
            money,
            queue,
            queue-watch,
            ordering,
            a2a-direct,
            checkpoints,
            settings,
            cli,
            connection,
            migrations,
            outcome,
            store-bound,
          ]
    env:
      MUTATION_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4

      - name: Start MongoDB 7 (replica set rs0 on 27017-27019, standalone on 27020)
        run: .github/start-mongo.sh

      - name: Resolve the pinned framework
        id: pin
        run: |
          echo "sha=$(node -p "require('./.agboss-version.json').frameworkSha")" >> "$GITHUB_OUTPUT"
          echo "source=$(node -p "require('./.agboss-version.json').source ?? 'commit'")" >> "$GITHUB_OUTPUT"

      - name: Check out agbossjs/agboss at the pinned SHA
        if: steps.pin.outputs.source != 'registry'
        uses: actions/checkout@v4
        with:
          repository: agbossjs/agboss
          ref: ${{ steps.pin.outputs.sha }}
          path: .agboss-source

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Pack @agboss/core as pinned (a commit, or the registry's) and install the tarball
        env:
          AGBOSS_REPO_DIR: .agboss-source
        run: |
          npm run pack:framework
          npm run install:packed

      - name: Initiate the replica set
        run: .github/mongo-replica-set.sh

      # the CLI's tests run bin/, which imports the built package; the flow types for the fixtures
      - name: Build
        run: npm run build && npm run check:types

      - name: Restore the shard's last mutation run
        uses: actions/cache@v4
        with:
          path: reports/stryker-incremental-${{ matrix.shard }}.json
          key: stryker-${{ matrix.shard }}-${{ hashFiles('stryker.config.mjs', 'scripts/mutation-shards.mjs', 'scripts/stryker-timeouts-ms.mjs', 'vitest.mutation.config.ts') }}-${{ github.sha }}
          restore-keys: stryker-${{ matrix.shard }}-${{ hashFiles('stryker.config.mjs', 'scripts/mutation-shards.mjs', 'scripts/stryker-timeouts-ms.mjs', 'vitest.mutation.config.ts') }}-

      # below the job's 120 minutes (a shard runs 45 to 95 of them), so a runaway one fails here and the
      # report below still uploads (agbossjs/mongodb#92)
      - name: Mutation testing of the shard (break below 100 % killed or justified)
        timeout-minutes: 100
        run: npm run test:mutation

      # a Timeout counts as killed and hid survivors (agbossjs/mongodb#103): none that is not a proven hang
      - name: Timeouts of the shard are proven hangs
        if: always() && hashFiles(format('reports/mutation/{0}.json', matrix.shard)) != ''
        run: node scripts/stryker-timeouts.mjs reports/mutation/${{ matrix.shard }}.json

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report-${{ matrix.shard }}
          path: reports/mutation/
